<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>利用者目線の見直し</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">
<style>
  :root { --bg: #ffffff; --sub: #f6f8fa; --line: #d0d7de; --muted: #59636e; --accent: #0969da; --warn-bg: #fff8c5; --warn-line: #d4a72c; --err: #cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --sub: #151b23; --line: #3d444d; --muted: #9198a1; --accent: #4493f8; --warn-bg: #272115; --warn-line: #9e6a03; --err: #f85149; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); }
  .bar { position: sticky; top: 0; z-index: 10; display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: var(--sub); border-bottom: 1px solid var(--line); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; color: var(--muted); }
  .bar .status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .status.error { color: var(--err); font-weight: 600; }
  .bar button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: inherit; cursor: pointer; }
  .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
  nav.toc { position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 72px); overflow: auto; font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  nav.toc a { display: block; padding: 2px 8px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; }
  nav.toc a:hover { color: var(--accent); border-left-color: var(--accent); }
  nav.toc a.h3 { padding-left: 20px; font-size: 12px; }
  .markdown-body { min-width: 0; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  .markdown-body .diagram { margin: 0 0 16px; padding: 16px; overflow-x: auto; text-align: center; border: 1px solid var(--line); border-radius: 8px; background: var(--sub); }
  /* 図は縮めずに原寸で表示し、はみ出す分は横スクロールにする */
  .markdown-body .diagram svg { max-width: none; height: auto; }
  .markdown-body .diagram.failed { text-align: left; border-color: var(--err); }
  .markdown-body .diagram.failed .msg { margin-bottom: 8px; color: var(--err); font-weight: 600; }
  .markdown-body blockquote { border-left-color: var(--warn-line); background: var(--warn-bg); padding: 8px 16px; color: inherit; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    nav.toc { display: none; }
  }
</style>
</head>
<body>
<div class="bar">
  <span class="status" id="status">読み込み中…</span>
  <button type="button" id="copy">Markdown をコピー</button>
</div>
<div class="layout">
  <nav class="toc" id="toc" aria-label="目次"></nav>
  <article class="markdown-body" id="content"></article>
</div>
<script>
  // publish-report.sh がレポートの Markdown を JSON 文字列として埋め込む
  window.REPORT_MARKDOWN = __REPORT_JSON__;
</script>
<script type="module">
  import { marked } from "https://cdn.jsdelivr.net/npm/marked@16/lib/marked.esm.js";
  import DOMPurify from "https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.es.mjs";
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  const md = window.REPORT_MARKDOWN;
  const content = document.getElementById("content");
  const status = document.getElementById("status");

  content.innerHTML = DOMPurify.sanitize(marked.parse(md, { gfm: true }));

  const h1 = content.querySelector("h1");
  if (h1) document.title = h1.textContent;

  // 見出しに id を振って目次を作る
  const toc = document.getElementById("toc");
  content.querySelectorAll("h2, h3").forEach((h, i) => {
    h.id = `s${i}`;
    const a = document.createElement("a");
    a.href = `#${h.id}`;
    a.textContent = h.textContent;
    a.className = h.tagName.toLowerCase();
    toc.appendChild(a);
  });

  // 外部リンクは別タブで開く
  content.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });

  // ```mermaid のコードブロックを図に置き換える
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const natural = { useMaxWidth: false };
  mermaid.initialize({
    startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict",
    fontFamily: "-apple-system, 'Hiragino Sans', sans-serif",
    flowchart: natural, sequence: natural, state: natural, er: natural, class: natural, gantt: natural, journey: natural,
  });
  const blocks = [...content.querySelectorAll("pre > code.language-mermaid")];
  let failed = 0;
  for (const [i, code] of blocks.entries()) {
    const source = code.textContent;
    const box = document.createElement("div");
    box.className = "diagram";
    code.parentElement.replaceWith(box);
    try {
      const { svg } = await mermaid.render(`mermaid-${i}`, source);
      box.innerHTML = svg;
    } catch (e) {
      failed++;
      box.classList.add("failed");
      const msg = document.createElement("div");
      msg.className = "msg";
      msg.textContent = `図 ${i + 1} の描画に失敗: ${String(e?.message ?? e).split("\n")[0]}`;
      const pre = document.createElement("pre");
      pre.textContent = source;
      box.append(msg, pre);
      document.getElementById(`dmermaid-${i}`)?.remove();
    }
  }

  // 横にはみ出す図は読みにくいので数を出す（向きを TB にするなどの見直しの目安）
  const wide = [...content.querySelectorAll(".diagram:not(.failed)")].filter((box) => box.scrollWidth > box.clientWidth + 1).length;
  status.textContent = failed
    ? `⚠️ 図の描画エラー ${failed} 件（全 ${blocks.length} 件）`
    : `図 ${blocks.length} 件を描画しました${wide ? `（横にはみ出す図 ${wide} 件）` : ""}`;
  status.classList.toggle("error", failed > 0);
  document.body.dataset.mermaidFailed = String(failed);

  document.getElementById("copy").addEventListener("click", async (e) => {
    await navigator.clipboard.writeText(md);
    e.target.textContent = "コピーしました";
    setTimeout(() => (e.target.textContent = "Markdown をコピー"), 1500);
  });
</script>
</body>
</html>
